[project]
name = "ai-engineering-modulo-1"
version = "0.1.0"
description = "Async LLM manager with streaming, Pydantic validation, and retries."
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "openai",
    "anthropic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["async_llm_manager"]
